plugins {
    id 'com.android.application'
}

android {
    namespace 'org.pcpos.helpdesk'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'org.pcpos.helpdesk'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
    }

    sourceSets.main {
        manifest.srcFile '../AndroidManifest.xml'
        java.srcDirs = ['../src']
    }
}
